services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./logs:/var/log/coopandina
      # Para cargar el histórico con cargar_datos --dir data/historico.
      - ./backend/data/historico:/app/data/historico:ro
    expose: ["8000"]
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports: ["80:80"]
    depends_on: [backend]
    restart: unless-stopped
