x-kafka-comun: &kafka-comun
  image: confluentinc/cp-kafka:7.5.0
  restart: unless-stopped
  networks: [kafka-net]

x-kafka-env: &kafka-env
  CLUSTER_ID: ${CLUSTER_ID}
  KAFKA_CLUSTER_ID: ${CLUSTER_ID}
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
  KAFKA_LOG_DIRS: "/var/lib/kafka/data"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_NUM_PARTITIONS: "3"
  KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g"

networks:
  kafka-net:
    driver: bridge

volumes:
  k1-data:
  k2-data:
  k3-data:

services:
  kafka-1:
    <<: *kafka-comun
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "19092:19092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:9092,EXTERNAL://${KAFKA_PRIVATE_IP}:19092"
    volumes:
      - k1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-comun
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "29092:29092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9092,EXTERNAL://${KAFKA_PRIVATE_IP}:29092"
    volumes:
      - k2-data:/var/lib/kafka/data
    depends_on: [kafka-1]

  kafka-3:
    <<: *kafka-comun
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "39092:39092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:39092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9092,EXTERNAL://${KAFKA_PRIVATE_IP}:39092"
    volumes:
      - k3-data:/var/lib/kafka/data
    depends_on: [kafka-1, kafka-2]
